{% extends 'base.html' %}

{% block title %}Admin Login - LuxeCraft Portal{% endblock %}

{% block content %}
<section style="min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; border-color: var(--border-glow); box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="logo-badge" style="width: 48px; height: 48px; font-size: 1.2rem; margin: 0 auto 1rem auto;">LC</div>
            <h2 style="font-size: 1.8rem; margin-bottom: 0.3rem;">Admin Portal</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to manage studio services, portfolio, and inquiries.</p>
        </div>

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter admin username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                Sign In to Portal →
            </button>
        </form>

        <div style="margin-top: 1.8rem; text-align: center; padding-top: 1.2rem; border-top: 1px solid var(--border-color);">
            <p style="color: var(--text-muted); font-size: 0.82rem;">
                🔑 Default Demo Credentials:<br>Username: <strong style="color: var(--accent);">admin</strong> | Password: <strong style="color: var(--accent);">admin123</strong>
            </p>
        </div>
    </div>
</section>
{% endblock %}
